# Netlify Configuration for Multi-Tenant School Management System
# This enables subdomain support (e.g., dps.ajaytech.netlify.app)

[build]
  # Build command for React app
  command = "npm run build"
  # Output directory
  publish = "build"

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enable wildcard subdomain support
# This allows any subdomain like dps.ajaytech.netlify.app to work
[build.environment]
  # Set your backend URL here or use Netlify environment variables
  # REACT_APP_BACKEND_URL = "https://your-backend-url.com"

# Headers for CORS and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers for API routes (if proxying)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Tenant"
    Access-Control-Allow-Credentials = "true"

